<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Two ways to localize a docs repo: a mirrored second content tree that must be kept in sync, marked as the way we didn't go, versus dot-suffix files where page.es.mdx sits beside page.mdx in the same folder">
  <style>
    .ln{fill:none;stroke:#1a1a1a;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .ln2{fill:none;stroke:#1a1a1a;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .fl{fill:#1a1a1a;stroke:none}
    .bgf{fill:#F5F0EB;stroke:none}
    .txi{font:700 15px 'Plus Jakarta Sans','Segoe UI',sans-serif;fill:#1a1a1a}
    .txs{font:600 11.5px 'Plus Jakarta Sans','Segoe UI',sans-serif;fill:#555}
    .txm{font:600 12.5px 'SF Mono',Consolas,monospace;fill:#1a1a1a}
  </style>
  <!-- parchment card -->
  <rect x="1" y="1" width="798" height="358" rx="10" fill="#F5F0EB" stroke="#e6dfd1" stroke-width="2"/>

  <!-- LEFT PANEL: the mirrored tree (not taken) -->
  <rect class="bgf" x="40" y="52" width="330" height="216" rx="10"/>
  <rect class="ln" x="40" y="52" width="330" height="216" rx="10"/>

  <!-- folder A: content/ -->
  <path class="ln" d="M66 106 h40 l10 10 h56 v62 h-106 z"/>
  <line class="ln2" x1="82" y1="136" x2="152" y2="136"/>
  <line class="ln2" x1="82" y1="150" x2="152" y2="150"/>
  <line class="ln2" x1="82" y1="164" x2="130" y2="164"/>
  <text class="txm" x="119" y="202" text-anchor="middle">content/</text>

  <!-- folder B: content-es/ -->
  <path class="ln" d="M238 106 h40 l10 10 h56 v62 h-106 z"/>
  <line class="ln2" x1="254" y1="136" x2="324" y2="136"/>
  <line class="ln2" x1="254" y1="150" x2="324" y2="150"/>
  <line class="ln2" x1="254" y1="164" x2="302" y2="164"/>
  <text class="txm" x="291" y="202" text-anchor="middle">content-es/</text>

  <!-- sync tension: dashed double arrow between the trees -->
  <line class="ln2" x1="180" y1="142" x2="230" y2="142" stroke-dasharray="2 7"/>
  <path class="ln2" d="M188 135 l-8 7 l8 7"/>
  <path class="ln2" d="M222 135 l8 7 l-8 7"/>
  <text class="txs" x="205" y="126" text-anchor="middle">sync?</text>

  <!-- prohibition badge -->
  <circle class="ln" cx="345" cy="78" r="16" fill="#F5F0EB"/>
  <line class="ln" x1="334" y1="89" x2="356" y2="67"/>

  <text class="txs" x="205" y="238" text-anchor="middle">every new page, rename, and move</text>
  <text class="txs" x="205" y="254" text-anchor="middle">needs a twin in the other tree</text>
  <text class="txi" x="205" y="296" text-anchor="middle">A MIRRORED TREE</text>
  <text class="txs" x="205" y="316" text-anchor="middle">the way we didn't go</text>

  <!-- arrow between panels -->
  <line class="ln" x1="382" y1="160" x2="416" y2="160"/>
  <path class="ln" d="M406 150 l12 10 l-12 10"/>

  <!-- RIGHT PANEL: the dot suffix -->
  <rect class="bgf" x="430" y="52" width="330" height="216" rx="10"/>
  <rect class="ln" x="430" y="52" width="330" height="216" rx="10"/>
  <text class="txm" x="452" y="82" text-anchor="start">content/help/</text>

  <!-- file: page.mdx -->
  <path class="ln" d="M480 100 h48 l16 16 v68 h-64 z"/>
  <path class="ln2" d="M528 100 v16 h16"/>
  <line class="ln2" x1="492" y1="132" x2="530" y2="132"/>
  <line class="ln2" x1="492" y1="146" x2="530" y2="146"/>
  <line class="ln2" x1="492" y1="160" x2="516" y2="160"/>
  <text class="txm" x="512" y="206" text-anchor="middle">page.mdx</text>
  <text class="txs" x="512" y="226" text-anchor="middle">/help/…</text>

  <!-- file: page.es.mdx -->
  <path class="ln" d="M614 100 h48 l16 16 v68 h-64 z"/>
  <path class="ln2" d="M662 100 v16 h16"/>
  <line class="ln2" x1="626" y1="132" x2="664" y2="132"/>
  <line class="ln2" x1="626" y1="146" x2="664" y2="146"/>
  <line class="ln2" x1="626" y1="160" x2="650" y2="160"/>
  <text class="txm" x="646" y="206" text-anchor="middle">page.es.mdx</text>
  <text class="txs" x="646" y="226" text-anchor="middle">/es/help/…</text>

  <text class="txs" x="595" y="252" text-anchor="middle">same folder, same git history</text>
  <text class="txi" x="595" y="296" text-anchor="middle">THE DOT SUFFIX</text>
  <text class="txs" x="595" y="316" text-anchor="middle">the translation lives beside the source</text>

  <!-- bottom line -->
  <text class="txs" x="400" y="346" text-anchor="middle">adding a language = one array entry + one script run</text>
</svg>
